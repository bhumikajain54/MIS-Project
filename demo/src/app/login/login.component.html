<div class="w-full min-h-screen bg-premium-light/50 flex items-center justify-center py-20 px-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-10">
            <h2 class="text-4xl font-extrabold text-premium-dark mb-2">Welcome Back</h2>
            <p class="text-gray-600">Please sign in to your account</p>
        </div>
        
        <div class="bg-white rounded-3xl p-8 lg:p-12 shadow-premium-lg border border-gray-100">
            <form (ngSubmit)="onLogin()">
                <div class="mb-6">
                    <label for="username" class="block text-gray-700 font-semibold mb-2">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400"></i>
                        </div>
                        <input
                            type="text"
                            id="username"
                            [(ngModel)]="username"
                            name="username"
                            required
                            class="block w-full pl-11 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-premium-primary focus:border-transparent outline-none transition-all"
                            placeholder="Enter your username"
                        />
                    </div>
                </div>
                
                <div class="mb-8">
                    <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input
                            type="password"
                            id="password"
                            [(ngModel)]="password"
                            name="password"
                            required
                            class="block w-full pl-11 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-premium-primary focus:border-transparent outline-none transition-all"
                            placeholder="Enter your password"
                        />
                    </div>
                </div>

                <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-r-lg">
                    <p class="mb-0 flex items-center">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        {{ errorMessage }}
                    </p>
                </div>

                <button type="submit" class="w-full btn-premium py-4 rounded-xl text-lg font-bold text-white shadow-premium-md hover:shadow-premium-lg transition-all">
                    Sign In
                </button>
            </form>
            
            <div class="mt-8 text-center">
                <p class="text-gray-600 mb-0">Don't have an account? <a routerLink="/register" class="text-premium-primary font-bold hover:underline">Register</a></p>
            </div>
        </div>
    </div>
</div>
