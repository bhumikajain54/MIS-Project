<!-- Quote Start -->
<div class="w-full py-20 bg-premium-light/30">
    <div class="max-w-7xl mx-auto px-4 lg:px-8">
        <div class="text-center mx-auto max-w-2xl mb-16 wow fadeInUp" data-wow-delay="0.1s">
            <h1 class="text-4xl lg:text-5xl font-bold text-premium-dark leading-tight mb-4">Request a Free Quote</h1>
            <p class="text-gray-600 text-lg">Fill out the form below and our team will get back to you with a customized insurance quote.</p>
        </div>
        
        <div class="wow fadeIn" data-wow-delay="0.5s">
            <div class="bg-white rounded-3xl p-8 lg:p-12 shadow-premium-lg border border-gray-100 max-w-4xl mx-auto">
                <form>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-gray-700 font-semibold mb-2" for="name">Full Name</label>
                            <input type="text" id="name" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-premium-primary focus:border-transparent outline-none transition-all" placeholder="John Doe">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-semibold mb-2" for="email">Email Address</label>
                            <input type="email" id="email" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-premium-primary focus:border-transparent outline-none transition-all" placeholder="john@example.com">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-semibold mb-2" for="phone">Phone Number</label>
                            <input type="text" id="phone" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-premium-primary focus:border-transparent outline-none transition-all" placeholder="+123 456 7890">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-semibold mb-2" for="insurance-type">Insurance Type</label>
                            <select id="insurance-type" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-premium-primary focus:border-transparent outline-none transition-all">
                                <option value="life">Life Insurance</option>
                                <option value="health">Health Insurance</option>
                                <option value="home">Home Insurance</option>
                                <option value="auto">Auto Insurance</option>
                                <option value="business">Business Insurance</option>
                            </select>
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-gray-700 font-semibold mb-2" for="details">Additional Details</label>
                            <textarea id="details" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-premium-primary focus:border-transparent outline-none transition-all h-32 resize-none" placeholder="Please provide any additional details about what you're looking for..."></textarea>
                        </div>
                        <div class="sm:col-span-2 mt-4 text-center">
                            <button class="w-full sm:w-auto btn-premium py-4 px-12 rounded-xl text-lg font-bold text-white shadow-premium-md hover:shadow-premium-lg" type="submit">Get My Quote</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- Quote End -->
