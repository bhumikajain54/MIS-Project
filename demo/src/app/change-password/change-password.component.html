<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-premium-sm border-0 rounded-3xl p-4">
        <h2 class="mb-4">Change Password</h2>
        <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
          <!-- Old Password -->
          <div class="mb-3">
            <label for="currentPassword" class="form-label">Old Password</label>
            <input id="currentPassword" class="form-control" formControlName="currentPassword" type="password" placeholder="Enter Old Password">
          </div>

          <!-- New Password -->
          <div class="mb-3">
            <label for="newPassword" class="form-label">New Password</label>
            <input id="newPassword" class="form-control" formControlName="newPassword" type="password" placeholder="Enter New Password">
          </div>

          <!-- Confirm Password -->
          <div class="mb-4">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input id="confirmPassword" class="form-control" formControlName="confirmPassword" type="password" placeholder="Confirm New Password">
          </div>

          <!-- Button Group -->
          <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-primary px-4 py-2">Update</button>
            <button type="button" class="btn btn-secondary px-4 py-2" (click)="onCancel()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
