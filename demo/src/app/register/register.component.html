<div class="w-full min-h-screen bg-premium-light/50 flex items-center justify-center py-20 px-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-10">
            <h2 class="text-4xl font-extrabold text-premium-dark mb-2">Create Account</h2>
            <p class="text-gray-600">Please fill the details to register</p>
        </div>
        
        <div class="bg-white rounded-3xl p-8 lg:p-12 shadow-premium-lg border border-gray-100">
            <form (ngSubmit)="onRegister()">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="firstname" class="block text-gray-700 font-semibold mb-2 text-sm">First Name</label>
                        <input
                            type="text"
                            id="firstname"
                            [(ngModel)]="firstname"
                            name="firstname"
                            required
                            class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-premium-primary focus:border-transparent outline-none transition-all"
                            placeholder="John"
                        />
                    </div>
                    <div>
                        <label for="lastname" class="block text-gray-700 font-semibold mb-2 text-sm">Last Name</label>
                        <input
                            type="text"
                            id="lastname"
                            [(ngModel)]="lastname"
                            name="lastname"
                            required
                            class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-premium-primary focus:border-transparent outline-none transition-all"
                            placeholder="Doe"
                        />
                    </div>
                </div>

                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-semibold mb-2 text-sm">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                        <input
                            type="email"
                            id="email"
                            [(ngModel)]="email"
                            name="email"
                            required
                            class="block w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-premium-primary focus:border-transparent outline-none transition-all"
                            placeholder="Enter your email"
                        />
                    </div>
                </div>

                <div class="mb-4">
                    <label for="role" class="block text-gray-700 font-semibold mb-2 text-sm">Select Role</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-user-tag text-gray-400"></i>
                        </div>
                        <select
                            id="role"
                            [(ngModel)]="role"
                            name="role"
                            required
                            class="block w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-premium-primary focus:border-transparent outline-none transition-all appearance-none"
                        >
                            <option *ngFor="let r of availableRoles" [value]="r.value">{{ r.label }}</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <i class="fas fa-chevron-down text-gray-400 text-sm"></i>
                        </div>
                    </div>
                </div>
                
                <div class="mb-6">
                    <label for="password" class="block text-gray-700 font-semibold mb-2 text-sm">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input
                            type="password"
                            id="password"
                            [(ngModel)]="password"
                            name="password"
                            required
                            class="block w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-premium-primary focus:border-transparent outline-none transition-all"
                            placeholder="Create a password"
                        />
                    </div>
                </div>

                <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-r-lg">
                    <p class="mb-0 flex items-center">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        {{ errorMessage }}
                    </p>
                </div>

                <div *ngIf="successMessage" class="mb-6 p-4 bg-green-50 border-l-4 border-green-500 text-green-700 rounded-r-lg">
                    <p class="mb-0 flex items-center">
                        <i class="fas fa-check-circle mr-2"></i>
                        {{ successMessage }}
                    </p>
                </div>

                <button type="submit" class="w-full btn-premium py-4 rounded-xl text-lg font-bold text-white shadow-premium-md hover:shadow-premium-lg transition-all">
                    Register
                </button>
            </form>
            
            <div class="mt-8 text-center">
                <p class="text-gray-600 mb-0">Already have an account? <a routerLink="/login" class="text-premium-primary font-bold hover:underline">Sign In</a></p>
            </div>
        </div>
    </div>
</div>
