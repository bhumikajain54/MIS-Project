<div class="container mt-4">
  <div class="content">
    <h1>POSP Activation Report</h1>
    <form>
      <div class="row g-3">
        <div class="col-md-4">
          <label for="keyword" class="form-label">Keyword</label>
          <input type="text" class="form-control" id="keyword" placeholder="Enter keyword">
        </div>
        <div class="col-md-4">
          <label for="fromDate" class="form-label">From Date</label>
          <input type="date" class="form-control" id="fromDate">
        </div>
        <div class="col-md-4">
          <label for="toDate" class="form-label">To Date</label>
          <input type="date" class="form-control" id="toDate">
        </div>
        <div class="col-md-4">
          <label for="status" class="form-label">Status</label>
          <select id="status" class="form-select">
            <option value="">Please Select</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="pending">Pending</option>
          </select>
        </div>
      </div>
      <div class="row mt-4 mb-2">
        <div class="col-md-12 mt-2 d-flex gap-2">
          <button type="button" class="btn btn-primary px-4 shadow-sm">Search</button>
          <button type="button" class="btn btn-secondary px-4 shadow-sm">Export</button>
          <button type="button" class="btn btn-danger px-4 shadow-sm">Reset</button>
        </div>
      </div>
    </form>
    
    <div class="card premium-card mt-5 shadow-sm border-0">
      <div class="card-header bg-premium-dark text-white rounded-t-lg d-flex justify-content-between align-items-center p-3">
        <h5 class="mb-0 font-semibold"><i class="fas fa-file-alt me-2"></i> Report Results</h5>
        <span class="badge bg-primary px-3 py-2" style="font-size: 0.9rem;">Total Count: 0</span>
      </div>
      <div class="card-body p-0">
        <table class="table table-hover table-striped mb-0">
          <thead>
            <tr>
              <th>POSP Name</th>
              <th>Mobile</th>
              <th>Email</th>
              <th>Status</th>
              <th>Activation Date</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="5" class="text-center py-5 text-muted">
                <i class="fas fa-folder-open fa-3x mb-3 text-secondary"></i>
                <h5 class="font-semibold">No Record/s Available</h5>
                <p class="text-sm mb-0">Try adjusting your search filters to find what you're looking for.</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
