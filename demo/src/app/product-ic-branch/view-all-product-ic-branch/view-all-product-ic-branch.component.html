<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 font-semibold text-gray-800">Product-IC Branch</h1>
  </div>

  <div class="card premium-card shadow-sm border-0">
    <div class="card-header bg-premium-dark text-white rounded-t-lg d-flex justify-content-between align-items-center p-3" style="background-color: #4f46e5;">
      <h5 class="mb-0 font-semibold"><i class="fas fa-building me-2"></i> Insurance Companies</h5>
      <span class="badge bg-light text-primary px-3 py-2 shadow-sm" style="font-size: 0.9rem;">Total Count: {{ insuranceData.length }}</span>
    </div>
    <div class="card-body p-0">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-light">
          <tr>
            <th class="px-4 py-3">S.No</th>
            <th class="px-4 py-3">IC Code</th>
            <th class="px-4 py-3">IC Full Name</th>
            <th class="px-4 py-3 text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let insurance of insuranceData; let i = index">
            <td class="px-4 align-middle">{{ i + 1 }}</td>
            <td class="px-4 align-middle fw-medium">{{ insurance.insuranceCompanyId }}</td>
            <td class="px-4 align-middle">{{ insurance.insuranceCompanyName }}</td>
            <td class="px-4 align-middle text-center">
              <button class="btn btn-sm btn-outline-primary rounded-pill px-3" (click)="viewDetails(insurance)">
                <i class="fas fa-eye me-1"></i> View
              </button>
            </td>
          </tr>
          <tr *ngIf="!insuranceData || insuranceData.length === 0">
            <td colspan="4" class="text-center py-5 text-muted">
              <i class="fas fa-box-open fa-3x mb-3 text-secondary"></i>
              <h5 class="font-semibold mt-2">No Insurance Companies Found</h5>
              <p class="text-sm mb-0">There is currently no data available to display.</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
