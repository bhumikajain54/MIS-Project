<div class="w-full py-20 bg-white overflow-hidden">
    <div class="max-w-7xl mx-auto px-4 lg:px-8">
        <div class="text-center mx-auto max-w-2xl mb-16">
            <h1 class="text-4xl lg:text-5xl font-bold text-premium-dark leading-tight">What Our Clients Say</h1>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
            <div class="hidden md:flex md:col-span-3 flex-col justify-around items-center h-full min-h-[400px]">
                <img src="../../assets/image/testimonial-1.jpg" alt="" class="w-20 h-20 rounded-full object-cover border-4 border-white shadow-premium-md transition-transform duration-300 hover:scale-110 -translate-x-6">
                <img src="../../assets/image/testimonial-2.jpg" alt="" class="w-28 h-28 rounded-full object-cover border-4 border-white shadow-premium-lg transition-transform duration-300 hover:scale-110 translate-x-8">
                <img src="../../assets/image/testimonial-3.jpg" alt="" class="w-16 h-16 rounded-full object-cover border-4 border-white shadow-premium-sm transition-transform duration-300 hover:scale-110 -translate-x-4">
            </div>

            <div class="col-span-1 md:col-span-6 relative">
                <div id="testimonialCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner pb-12">
                        <div *ngFor="let item of carouselItems; let i = index" [class.active]="i === 0" class="carousel-item">
                            <div class="bg-premium-light/50 backdrop-blur-sm rounded-3xl p-10 text-center shadow-premium-md mx-4">
                                <img class="w-24 h-24 rounded-full mx-auto mb-6 object-cover border-4 border-white shadow-premium-sm" [src]="item.images">
                                <p class="text-gray-600 text-lg lg:text-xl italic mb-8 leading-relaxed">"{{ item.text }}"</p>
                                <h5 class="text-2xl font-bold text-premium-dark mb-1">{{ item.title }}</h5>
                                <span class="text-premium-primary font-semibold block">{{ item.prof }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hidden md:flex md:col-span-3 flex-col justify-around items-center h-full min-h-[400px]">
                <img src="../../assets/image/testimonial-1.jpg" alt="" class="w-16 h-16 rounded-full object-cover border-4 border-white shadow-premium-sm transition-transform duration-300 hover:scale-110 translate-x-4">
                <img src="../../assets/image/testimonial-2.jpg" alt="" class="w-28 h-28 rounded-full object-cover border-4 border-white shadow-premium-lg transition-transform duration-300 hover:scale-110 -translate-x-8">
                <img src="../../assets/image/testimonial-3.jpg" alt="" class="w-20 h-20 rounded-full object-cover border-4 border-white shadow-premium-md transition-transform duration-300 hover:scale-110 translate-x-6">
            </div>
        </div>
    </div>
</div>
